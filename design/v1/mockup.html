<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duo — ひらく、毎日。画面モック</title>
<style>
:root{--paper:#f7f4ed;--card:#fffdfa;--ink:#293b35;--muted:#68716a;--line:#dddcd3;--green:#294e42}*{box-sizing:border-box}body{margin:0;background:#e7e8e0;color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent;min-height:44px;border-radius:10px;padding:8px 12px}button:hover{background:#e6e9df}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a77538;outline-offset:2px}button[aria-pressed=true]{background:var(--green);color:white}.review{max-width:1000px;margin:auto;padding:24px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--muted)}.review h1{font-family:Georgia,'Hiragino Mincho ProN',serif;font-size:30px;margin:4px 0}.review p{color:var(--muted);margin:6px 0 16px}.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.controls button{background:#f7f4ed}.controls button[aria-pressed=true]{background:var(--green)}#measure{font-size:12px;margin:12px 0}.device{margin:0 auto 24px;width:626px;max-width:100%;height:890px;border:1px solid #c9cec4;border-radius:28px;overflow:auto;background:var(--paper);box-shadow:0 20px 65px #293b351c;container-type:inline-size;position:relative}.app{min-height:100%;display:flex;flex-direction:column;padding:20px 20px max(16px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at top left,#ffffff80,transparent 60%)}.brand{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}.logo{font:italic 30px Georgia,serif;letter-spacing:-1px}.small{font-size:12px;color:var(--muted)}.local{border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11px}.hero{display:block;padding:20px 0}.date{font:56px/1.1 Georgia,serif;letter-spacing:-2px}.date span{font:16px sans-serif;letter-spacing:0;margin-left:14px}.hero p{margin:8px 0;color:var(--muted)}.next{background:var(--green);color:white;border-radius:20px;padding:20px;text-align:left;width:100%;display:block}.next:hover{background:#355f50}.next small{color:#d7e3d9}.next strong{display:block;font-size:25px;font-weight:500;margin:8px 0}.next .time{font:30px Georgia,serif}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 10px;flex-wrap:wrap}.segment{display:flex;padding:3px;background:#e9e9e1;border-radius:13px}.segment button{padding:5px 15px;min-width:44px}.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;flex:1}.calendar,.agenda{min-width:0}.monthhead{display:flex;align-items:center;justify-content:space-between;gap:4px}.monthhead h2{font:26px Georgia,'Hiragino Mincho ProN',serif;margin:8px 0}.arrows{display:flex}.arrows button{padding:4px 10px}.variant{display:flex;gap:4px;margin:6px 0 14px}.variant button{font-size:12px;padding:4px 12px}.weekdays,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{color:var(--muted);font-size:11px;text-align:center;margin-bottom:6px}.week{position:relative;border-top:1px solid var(--line)}.day{min-width:0;padding:5px 1px;min-height:54px;border-radius:0;text-align:center;align-self:stretch;overflow:hidden}.day.out{color:#9a9d96}.num{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center}.day.today .num{box-shadow:inset 0 0 0 1px var(--green)}.day.selected .num{color:white;background:var(--green)}.dots{height:8px;display:flex;gap:3px;justify-content:center}.dot{width:4px;height:4px;border-radius:50%;background:var(--cat)}.work{--cat:#375a7f;--tint:#eaf0f7}.private{--cat:#885265;--tint:#f7eaf0}.golf{--cat:#396b49;--tint:#eaf3e9}.economy{--cat:#825a23;--tint:#f7eedc}.chip{background:var(--tint);color:var(--cat);display:block;font-size:10px;line-height:20px;border-radius:4px;padding:0 3px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}.named .day{min-height:110px;padding-bottom:28px;border-right:1px solid #e5e3db}.bar{position:absolute;bottom:4px;height:22px;min-height:22px;padding:1px 6px;background:var(--tint);color:var(--cat);font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;border-left:3px solid var(--cat);border-radius:4px}.legend{display:flex;gap:8px 12px;flex-wrap:wrap;padding:16px 0;font-size:11px}.legend span:before{content:'';display:inline-block;background:var(--cat);width:6px;height:6px;border-radius:50%;margin-right:5px}.agenda{border-top:1px solid var(--line);padding-top:16px}.agenda h3{font-size:18px;font-weight:500;margin:0 0 4px}.event{display:block;width:100%;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:13px;margin-top:12px;position:relative}.event:before{content:'';position:absolute;left:0;top:15px;bottom:15px;width:3px;background:var(--cat);border-radius:2px}.event .clock{font-size:18px;font-variant-numeric:tabular-nums}.event strong{display:block;font-size:15px;font-weight:500;margin:5px 0}.tag{color:var(--cat);font-size:11px}.empty{padding:24px 8px;color:var(--muted)}.foot{margin-top:auto;padding-top:20px;position:sticky;bottom:-1px;background:linear-gradient(transparent,var(--paper) 25%);padding-bottom:4px}.add{width:100%;background:var(--green);color:white;border-radius:15px;min-height:52px;font-size:16px}.add:hover{background:#386351}.folio{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding-top:12px;letter-spacing:.08em}.foldline{display:none}.weekview{display:grid;gap:8px}.weekrow{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}.weekrow>button{width:100%;text-align:left;font-weight:600}.weekrow .event{margin-top:4px}.daytitle{font:28px Georgia,serif}.hint{font-size:12px;color:var(--muted);text-align:center}.hidden{display:none!important}@container(min-width:600px){.hero{display:none}.layout{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}.agenda{border-top:0;border-left:1px solid var(--line);padding:10px 0 0 18px}.app{padding:22px}.toolbar{margin-top:20px}.day{min-height:65px}.foot .add{width:auto;padding:10px 28px;display:block;margin-left:auto}.weekview{grid-template-columns:1fr}.layout.single{grid-template-columns:1fr}.layout.single .agenda{display:none}}
.device.half .hero{display:none}.device.half .layout{display:flex;flex-direction:column;gap:0;min-height:0}.device.half .calendar{height:calc(var(--height) / 2 - 160px);min-height:115px;overflow:auto}.device.half .foldline{display:block;flex-shrink:0;height:24px;background:linear-gradient(#e8e5dc,#d8d7ce,#efede5);margin:12px -20px;border-top:1px solid #d3d3c9;border-bottom:1px solid #fff9;text-align:center;font-size:9px;color:#6b736b;letter-spacing:.18em}.device.half .agenda{border:0;padding:10px 0;display:block}.device.half .app{min-height:100%}.device.half .foot .add{width:100%}dialog{border:1px solid var(--line);border-radius:24px;padding:24px;background:var(--card);color:var(--ink);width:460px;max-width:calc(100vw - 24px);max-height:90dvh;box-shadow:0 25px 100px #132c3340}dialog::backdrop{background:#1a302d65;backdrop-filter:blur(4px)}dialog h2{font:26px Georgia,'Hiragino Mincho ProN',serif;margin:0}form label{display:block;margin-top:16px;font-size:13px}input,select{display:block;width:100%;min-height:46px;padding:10px;background:#f5f3ec;border:1px solid var(--line);border-radius:10px;color:var(--ink)}input[type=checkbox]{display:inline-block;width:20px;min-height:20px;vertical-align:middle;margin-right:8px}.formhead,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.actions{margin-top:24px}.primary{background:var(--green);color:white;padding:10px 24px}.danger{color:#963e38}.error{color:#963e38;font-size:13px}#status{min-height:24px;text-align:center;font-size:13px;color:var(--muted)}@media(max-width:520px){.review{padding:16px 8px}.review h1{font-size:25px}.device{border-radius:20px}.app{padding:16px}.controls{gap:3px}.controls button{font-size:12px;padding:6px 9px}}
</style>
</head>
<body>
<main class="review">
<div class="eyebrow">DUO CALENDAR / DESIGN STUDY 01</div><h1>ひらく、毎日。</h1><p>予定と余白を、ひとつの手帳に。</p>
<nav class="controls" aria-label="レビュー用端末プレビュー"><button data-device="closed" aria-pressed="false">閉じた</button><button data-device="open" aria-pressed="true">開いた</button><button data-device="half" aria-pressed="false">ハーフフォールド</button><button id="rotate" aria-pressed="false">↻ 横向き</button><button data-device="auto" aria-pressed="false">幅に追従</button></nav>
<div id="measure"></div>
<section class="device" id="device" aria-label="カレンダーモックアップ"><div class="app">
<header class="brand"><div><span class="logo">Duo.</span> <span class="small">私の手帳</span></div><span class="local">端末ローカル想定</span></header>
<section class="hero"><div class="eyebrow">TODAY / NOVEMBER 2026</div><div class="date">12<span>木曜日</span></div><p>今日も、いい一日に。</p><button class="next" id="next"><small>次の予定 · 仕事</small><strong>プロジェクト定例</strong><span class="time">10:00</span> — 11:00 <small>会議室 A</small></button></section>
<div class="toolbar"><div class="segment" aria-label="表示期間"><button data-view="day" aria-pressed="false">日</button><button data-view="week" aria-pressed="false">週</button><button data-view="month" aria-pressed="true">月</button></div><button id="today">今日に戻る ↗</button></div>
<div class="layout" id="layout"><section class="calendar"><div class="monthhead"><h2 id="monthtitle"></h2><div class="arrows"><button id="prev" aria-label="前の期間">‹</button><button id="forward" aria-label="次の期間">›</button></div></div><div class="variant" id="variant"><button data-style="simple" aria-pressed="true">手帳</button><button data-style="named" aria-pressed="false">予定名</button></div><div id="canvas"></div><div class="legend"><span class="work">仕事</span><span class="private">プライベート</span><span class="golf">ゴルフ</span><span class="economy">経済指標</span></div></section><div class="foldline">折り目の保護領域</div><aside class="agenda" id="agenda"></aside></div>
<footer class="foot"><button class="add" id="add">＋ 予定を追加</button><div class="folio"><span>暮らしに、余白を。</span><span>DUO / 2026</span></div></footer>
</div></section><div id="status" role="status" aria-live="polite"></div><p class="hint">レビュー用モック · 保存はこの画面内のみ／再読込でリセット<br>基準日 2026.11.12 9:41 · 経済指標は架空の予定例</p>
</main>
<dialog id="editor" aria-labelledby="edtitle"><form id="form"><div class="formhead"><h2 id="edtitle">予定を追加</h2><button type="button" id="close" aria-label="閉じる">✕</button></div><p class="small">手帳に、ひとつ予定を書きとめる。</p><label>予定名<input id="title" required maxlength="80" placeholder="例：プロジェクト定例"></label><label>カテゴリ<select id="category"><option value="work">仕事</option><option value="private">プライベート</option><option value="golf">ゴルフ</option><option value="economy">経済指標</option></select></label><label><input type="checkbox" id="allday">終日</label><label>開始<input id="start" type="datetime-local" required></label><label>終了<input id="end" type="datetime-local" required></label><label>場所<input id="place" placeholder="場所を追加"></label><p id="error" class="error" role="alert"></p><div class="actions"><button type="button" id="delete" class="danger">予定を削除</button><button class="primary" type="submit">保存</button></div><p class="small">モックアップ：端末への永続保存は行いません。</p></form></dialog>
<dialog id="confirm" aria-labelledby="confirmtitle"><h2 id="confirmtitle">この予定を削除しますか？</h2><p id="deletetitle"></p><div class="actions"><button id="canceldelete" autofocus>キャンセル</button><button class="danger" id="dodelete">削除する</button></div></dialog>
<script>
// レビュー専用：サンプルの描画と一時的なUI操作のみ。
const $=s=>document.querySelector(s),cats={work:'仕事',private:'プライベート',golf:'ゴルフ',economy:'経済指標'};
let events=[
{id:1,title:'プロジェクト定例',cat:'work',start:'2026-11-12T10:00',end:'2026-11-12T11:00',place:'会議室 A'},
{id:2,title:'ランチと散歩',cat:'private',start:'2026-11-12T12:30',end:'2026-11-12T13:30',place:'中目黒'},
{id:3,title:'米・物価指標（例）',cat:'economy',start:'2026-11-12T22:30',end:'2026-11-12T23:00',place:'公表予定のメモ'},
{id:4,title:'秋のゴルフ合宿',cat:'golf',start:'2026-11-13T00:00',end:'2026-11-15T23:59',place:'軽井沢',all:true},
{id:5,title:'デザインレビュー',cat:'work',start:'2026-11-10T14:00',end:'2026-11-10T15:00',place:'オンライン'},
{id:6,title:'家族で夕食',cat:'private',start:'2026-11-21T18:00',end:'2026-11-21T20:00',place:'いつものお店'},
{id:7,title:'出張・京都',cat:'work',start:'2026-11-19T00:00',end:'2026-11-23T23:59',place:'京都',all:true},
{id:8,title:'朝の練習',cat:'golf',start:'2026-11-28T07:00',end:'2026-11-28T08:00',place:'練習場'}];
let selected='2026-11-12',view='month',style='simple',mode='open',rotated=false,editing=null,origin=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Date(s+'T12:00:00'),key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const onday=d=>events.filter(e=>e.start.slice(0,10)<=d&&e.end.slice(0,10)>=d).sort((a,b)=>Number(!!b.all)-Number(!!a.all)||a.start.localeCompare(b.start));
const label=d=>date(d).toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
const time=e=>e.all?'終日':e.start.slice(11)+' – '+e.end.slice(11);
function card(e){return `<button class="event ${e.cat}" data-event="${e.id}"><span class="clock">${time(e)}</span><strong>${esc(e.title)}</strong><span class="tag">${cats[e.cat]}</span><span class="small"> · ${esc(e.place||'場所未設定')}</span>${e.start.slice(0,10)!==e.end.slice(0,10)?`<div class="small">${esc(e.start.slice(5,10))} 〜 ${esc(e.end.slice(5,10))}</div>`:''}</button>`}
function render(){let d=date(selected);$('#monthtitle').textContent=view==='month'?`${d.getFullYear()}年 ${d.getMonth()+1}月`:view==='week'?'今週の見通し':label(selected);$('#variant').hidden=view!=='month';$('#layout').classList.toggle('single',view!=='month');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===style));
let html='';if(view==='month'){html='<div class="weekdays">'+['日','月','火','水','木','金','土'].map(x=>`<span>${x}</span>`).join('')+'</div>';let first=new Date(d.getFullYear(),d.getMonth(),1);first.setDate(1-first.getDay());let weeks=Math.ceil((new Date(d.getFullYear(),d.getMonth(),1).getDay()+new Date(d.getFullYear(),d.getMonth()+1,0).getDate())/7);for(let w=0;w<weeks;w++){let days=Array.from({length:7},(_,i)=>{let t=new Date(first);t.setDate(first.getDate()+w*7+i);return key(t)});html+=`<div class="week ${style==='named'?'named':''}">`;for(const k of days){let es=onday(k),single=es.filter(e=>e.start.slice(0,10)===e.end.slice(0,10));html+=`<button class="day ${date(k).getMonth()!==d.getMonth()?'out':''} ${k===selected?'selected':''} ${k==='2026-11-12'?'today':''}" data-date="${k}" aria-label="${label(k)}、予定${es.length}件" aria-pressed="${k===selected}"><span class="num">${date(k).getDate()}</span>`;html+=style==='simple'?`<span class="dots">${es.slice(0,4).map(e=>`<i class="dot ${e.cat}"></i>`).join('')}</span>`:single.slice(0,2).map(e=>`<span class="chip ${e.cat}">${esc(e.title)}</span>`).join('')+(single.length>2?`<span class="small">ほか${single.length-2}件</span>`:'');html+='</button>'}if(style==='named'){events.filter(e=>e.start.slice(0,10)!==e.end.slice(0,10)&&e.start.slice(0,10)<=days[6]&&e.end.slice(0,10)>=days[0]).forEach((e,i)=>{let start=Math.max(0,days.findIndex(k=>k>=e.start.slice(0,10))),end=days.filter(k=>k<=e.end.slice(0,10)).length;html+=`<button class="bar ${e.cat}" data-event="${e.id}" style="left:${start*100/7}%;width:${(end-start)*100/7}%;bottom:${4+i*24}px" aria-label="${esc(e.title)} ${esc(e.start.slice(0,10))}から${esc(e.end.slice(0,10))}">${e.start.slice(0,10)<days[0]?'← ':''}${esc(e.title)}${e.end.slice(0,10)>days[6]?' →':''}</button>`})}html+='</div>'}}
else if(view==='day'){html=`<div class="daytitle">${label(selected)}</div>`+daylist(selected)}else{let start=date(selected);start.setDate(start.getDate()-start.getDay());html='<div class="weekview">';for(let i=0;i<7;i++){let t=new Date(start);t.setDate(t.getDate()+i);let k=key(t);html+=`<section class="weekrow"><button data-jump="${k}">${label(k)} ↗</button>${daylist(k)}</section>`}html+='</div>'}$('#canvas').innerHTML=html;$('#agenda').innerHTML=`<div class="eyebrow">YOUR DAY</div><h3>${label(selected)}</h3><div class="small">${onday(selected).length}件の予定</div>${daylist(selected)}`;
}
function daylist(k){return onday(k).map(card).join('')||`<div class="empty">予定のない、余白の一日。</div><button data-new="${k}">＋ この日に追加</button>`}
function preview(){let sizes=mode==='closed'?[466,678]:[626,890];if(rotated)sizes.reverse();$('#device').style.width=mode==='auto'?'100%':sizes[0]+'px';$('#device').style.height=sizes[1]+'px';$('#device').style.setProperty('--height',sizes[1]+'px');$('#device').classList.toggle('half',mode==='half');document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.device===mode));$('#rotate').setAttribute('aria-pressed',rotated);$('#rotate').textContent=rotated?'↻ 縦向き':'↻ 横向き';requestAnimationFrame(()=>{$('#measure').textContent=`レビュー専用 · ${mode==='auto'?'自動幅':sizes.join(' × ')+' CSS px'} · 実際の表示幅 ${Math.round($('#device').getBoundingClientRect().width)}px${mode==='half'?' · 上下分割／中央24px保護帯':''}`})}
function openEditor(id=null,day=selected){origin=document.activeElement;editing=id;let e=events.find(e=>e.id===id);$('#edtitle').textContent=e?'予定を編集':'予定を追加';$('#title').value=e?.title||'';$('#category').value=e?.cat||'work';$('#start').value=e?.start||day+'T10:00';$('#end').value=e?.end||day+'T11:00';$('#place').value=e?.place||'';$('#allday').checked=!!e?.all;$('#delete').hidden=!e;$('#error').textContent='';$('#editor').showModal();$('#title').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.device){mode=b.dataset.device;preview()}if(b.dataset.view){view=b.dataset.view;render()}if(b.dataset.style){style=b.dataset.style;render()}if(b.dataset.date){selected=b.dataset.date;render()}if(b.dataset.jump){selected=b.dataset.jump;view='day';render()}if(b.dataset.event)openEditor(Number(b.dataset.event));if(b.dataset.new)openEditor(null,b.dataset.new)});
$('#rotate').onclick=()=>{rotated=!rotated;preview()};window.addEventListener('resize',preview);$('#today').onclick=()=>{selected='2026-11-12';render()};function move(n){let d=date(selected);if(view==='month'){d.setDate(1);d.setMonth(d.getMonth()+n)}else d.setDate(d.getDate()+n*(view==='week'?7:1));selected=key(d);render()}$('#prev').onclick=()=>move(-1);$('#forward').onclick=()=>move(1);$('#add').onclick=()=>openEditor();$('#next').onclick=()=>openEditor(1);
$('#close').onclick=()=>$('#editor').close();$('#editor').addEventListener('close',()=>{if(origin?.isConnected)origin.focus();else $('#add').focus()});$('#form').onsubmit=e=>{e.preventDefault();if(!$('#title').value.trim()){$('#error').textContent='予定名を入力してください。';return}if($('#end').value<$('#start').value){$('#error').textContent='終了は開始以降にしてください。';return}let item={id:editing||Date.now(),title:$('#title').value.trim(),cat:$('#category').value,start:$('#start').value,end:$('#end').value,place:$('#place').value,all:$('#allday').checked};if(editing)events=events.map(x=>x.id===editing?item:x);else events.push(item);selected=item.start.slice(0,10);$('#editor').close();render();$('#status').textContent='予定を保存しました（このモック内のみ）。'};
$('#delete').onclick=()=>{$('#deletetitle').textContent=events.find(e=>e.id===editing)?.title;$('#confirm').showModal()};$('#canceldelete').onclick=()=>$('#confirm').close();$('#dodelete').onclick=()=>{events=events.filter(e=>e.id!==editing);$('#confirm').close();$('#editor').close();render();$('#status').textContent='予定を削除しました（このモック内のみ）。'};
render();preview();
</script>
</body></html>

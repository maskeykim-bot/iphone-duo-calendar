<script type="module">
// ---- common.js ----
// 試作用の共通部品：見開きの寸法、予定の多い日の中身（DOM と canvas の両方で同じ絵を描く）
// 寸法は design/21（開いた横 951×669、背 x484、右ページ x484〜860、左ページ x8〜458、溝 x466〜484）。
const G = { W: 951, H: 669, spine: 484, px0: 484, px1: 860, py0: 8, py1: 661, lx0: 8, lx1: 458, groove0: 466, groove1: 484, mid: 672 };
G.pw = G.px1 - G.px0; G.ph = G.py1 - G.py0;
const PAPER = '#F7F4ED', BACK = '#FBF9F4', RULE = '#EEEAE1', INK = '#2B2A27', SUB = '#8A867D';
const COLORS = ['#2F5E8E', '#C0675A', '#5BA3CF', '#9C8FE0', '#5C9A6B', '#D19A3A', '#7A7F87'];
const WD = '日月火水木金土';
const TITLES = ['給与振込み', '定例ミーティング', '筋膜リリース', '歯医者', '経済指標 CPI', 'ゴルフ練習', '資料の締切', '1on1', '買い物', '打ち合わせ（北摂）', 'ジム', '夕食 友人と', '電話 折り返し', '移動'];
function dayData(date) {
  const seed = date.getDate() * 7 + date.getMonth() * 31;
  const r = (i) => ((seed * 9301 + i * 49297) % 233280) / 233280;
  const chips = Array.from({ length: 4 }, (_, i) => ({ t: TITLES[(seed + i) % TITLES.length], c: COLORS[(seed + i) % COLORS.length] }));
  const evs = Array.from({ length: 10 }, (_, i) => ({ time: `${String(8 + i).padStart(2, '0')}:${r(i) > 0.5 ? '30' : '00'}`, t: TITLES[(seed + i * 3) % TITLES.length], c: COLORS[(seed + i * 2) % COLORS.length] }));
  const tasks = Array.from({ length: 4 }, (_, i) => ({ t: TITLES[(seed + i * 5 + 1) % TITLES.length] + 'の準備', done: r(i + 20) > 0.6 }));
  return { label: `${date.getMonth() + 1}月${date.getDate()}日`, wd: WD[date.getDay()], chips, evs, tasks };
}
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
// 1ページ（幅 pw×高 ph）の DOM。back=true は紙の裏の色
function pageEl(date, { back = false, w = G.pw } = {}) {
  const d = dayData(date);
  const el = document.createElement('div');
  el.className = 'dpage' + (back ? ' back' : ''); el.style.width = w + 'px';
  el.innerHTML = `<div class="dh"><b>${d.label}</b><span>${d.wd}</span></div>
  <div class="chips">${d.chips.map((c) => `<span class="chip" style="background:${c.c}">${c.t}</span>`).join('')}</div>
  <ul class="evs">${d.evs.map((e) => `<li><i style="background:${e.c}"></i><time>${e.time}</time><span>${e.t}</span></li>`).join('')}</ul>
  <div class="sec">タスク</div><ul class="tasks">${d.tasks.map((t) => `<li class="${t.done ? 'done' : ''}"><i></i>${t.t}</li>`).join('')}</ul>
  <div class="sec">NOTE ›</div><div class="lines"></div>`;
  return el;
}
const PAGE_CSS = `
.dpage{position:absolute;left:0;top:0;width:${G.pw}px;height:${G.ph}px;box-sizing:border-box;padding:14px 16px 0 16px;background:${PAPER} repeating-linear-gradient(180deg,transparent 0 29px,${RULE} 29px 30px);font:13px/18px -apple-system,'Hiragino Sans',sans-serif;color:${INK};overflow:hidden;-webkit-text-size-adjust:none}
.dpage.back{background-color:${BACK}}
.dark .dpage{background-color:#1C1F1D;background-image:repeating-linear-gradient(180deg,transparent 0 29px,#343A36 29px 30px);color:#E8E6E0}.dark .dh span,.dark .evs time,.dark .sec{color:#A3A9A2}
.dh{display:flex;align-items:baseline;gap:8px;height:34px}.dh b{font-size:24px}.dh span{color:${SUB};font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.chip{color:#fff;font-size:12px;padding:5px 10px;line-height:14px;border-radius:9px;white-space:nowrap;display:inline-block}
.evs{list-style:none;margin:0;padding:0}.evs li{display:flex;align-items:center;gap:8px;height:30px}.evs i{width:4px;height:18px;border-radius:2px}
.evs time{color:${SUB};font-size:12px;width:40px}.evs span{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{color:${SUB};font-size:11px;letter-spacing:.08em;margin:10px 0 2px}.tasks{list-style:none;margin:0;padding:0}.tasks li{height:28px;display:flex;align-items:center;gap:8px;font-size:13px}
.tasks i{width:14px;height:14px;border:1.5px solid #9C978D;border-radius:50%}.tasks li.done{color:${SUB};text-decoration:line-through}.tasks li.done i{background:#9C978D}
`;
// 同じ絵を canvas 2D に描く（WebGL のテクスチャ用。「事前に canvas に描く」方式）
function drawPage(ctx, date, { back = false, scale = 2, w = G.pw, dark = false } = {}) {
  const d = dayData(date);
  const INK = dark ? '#E8E6E0' : '#2B2A27', SUB = dark ? '#A3A9A2' : '#8A867D';
  ctx.save(); ctx.scale(scale, scale);
  ctx.fillStyle = dark ? '#1C1F1D' : back ? BACK : PAPER; ctx.fillRect(0, 0, w, G.ph);
  if (globalThis.__PLAIN) { ctx.restore(); return; } // 明暗だけを見る撮影用（文字・罫線なし）
  ctx.fillStyle = dark ? '#343A36' : RULE; for (let y = 29; y < G.ph; y += 30) ctx.fillRect(0, y, w, 1);
  const F = (w, s) => `${w} ${s}px -apple-system, "Hiragino Sans", sans-serif`;
  ctx.textBaseline = 'alphabetic'; ctx.fillStyle = INK; ctx.font = F('bold', 24); ctx.fillText(d.label, 16, 31);
  const lw = ctx.measureText(d.label).width; ctx.fillStyle = SUB; ctx.font = F('', 14); ctx.fillText(d.wd, 16 + lw + 8, 31);
  const W0 = w; let x = 16, y = 52; ctx.font = F('', 12);
  for (const c of d.chips) { const w = ctx.measureText(c.t).width + 20; if (x + w > W0 - 16) { x = 16; y += 30; } ctx.fillStyle = c.c; rr(ctx, x, y, w, 24, 9); ctx.fillStyle = '#fff'; ctx.fillText(c.t, x + 10, y + 16); x += w + 6; }
  y += 32;
  for (const e of d.evs) { ctx.fillStyle = e.c; rr(ctx, 16, y + 6, 4, 18, 2); ctx.fillStyle = SUB; ctx.font = F('', 12); ctx.fillText(e.time, 28, y + 20); ctx.fillStyle = INK; ctx.font = F('600', 14); ctx.fillText(e.t, 76, y + 20); y += 30; }
  ctx.fillStyle = SUB; ctx.font = F('', 11); ctx.fillText('タスク', 16, y + 23); y += 29;
  for (const t of d.tasks) { ctx.strokeStyle = '#9C978D'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(24.5, y + 14.5, 7.75, 0, 7); ctx.stroke(); if (t.done) { ctx.fillStyle = '#9C978D'; ctx.fill(); } ctx.fillStyle = t.done ? SUB : INK; ctx.font = F('', 13); ctx.fillText(t.t, 39, y + 19.5); y += 28; }
  ctx.fillStyle = SUB; ctx.font = F('', 11); ctx.fillText('NOTE ›', 16, y + 24);
  ctx.restore();
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); ctx.fill(); }
// コマ時間の集計
function stats(deltas) {
  const a = deltas.filter((v) => v > 0).sort((x, y) => x - y); if (!a.length) return null;
  const q = (p) => a[Math.min(a.length - 1, Math.floor(p * a.length))];
  return { frames: a.length, median: +q(0.5).toFixed(2), p95: +q(0.95).toFixed(2), max: +a[a.length - 1].toFixed(2), over16_7: +(a.filter((v) => v > 16.7).length / a.length * 100).toFixed(1), over8_3: +(a.filter((v) => v > 8.4).length / a.length * 100).toFixed(1) };
}

// ---- curl-geom.js ----
// めくりの形（design/21 §6.6〜6.9 の決まり）。WebGL 案・CSS 案で共通。
// forward（次の日へ）：右ページ x484〜860 の紙を背 x484 を軸に左へ。backward（前の日へ）：左ページ x8〜466 を右へ。
const DEG = Math.PI / 180;
const SET = {
  forward: { sgn: 1, x0: G.px0, x1: G.px1, spine: G.px0, edge: G.px1, mid: G.mid },
  // 前へ：めくる紙は右ページと同じ 376 幅で、背 x484 から左へ x108 まで（左ページの左の 100pt は紙に入らない。design/21 §6.11-4）
  backward: { sgn: -1, x0: 2 * G.px0 - G.px1, x1: G.px0, spine: G.px0, edge: 2 * G.px0 - G.px1, mid: (3 * G.px0 - G.px1) / 2 },
};
const TUNE = { maxTilt: 35, r0: 14, rk: 0.18, rMax: 58, flatten: 90 };
const hyp = Math.hypot;
// 指の位置 f を決まりの範囲に止める（design/21 §6.8・§6.10、qa CS-15）。
// 1) 傾きは垂直から 35° まで（指の向きを 35° の範囲に回す）。
// 2) 紙は背でつながっている：背の上端・下端から角までの距離は、背からつかんだ点までの元の距離を超えない。
// 3) 筒の分だけ折れはじめの線は背に近づくので、その線が背の上端・下端を越えない（背の点は動かない）。
// 範囲の外に指が出たら、つかんだ点から指へ向かう線の上で、届く一番遠い所に止める（指の方向だけ追う）。
function okF(s, g, f) {
  for (const sy of [G.py0, G.py1]) { if (Math.hypot(f[0] - s.spine, f[1] - sy) > Math.hypot(g[0] - s.spine, g[1] - sy) + 1e-6) return false; }
  const sh = shape(s, g, f); if (!sh) return true;
  for (const sy of [G.py0, G.py1]) if ((s.spine - sh.P[0]) * sh.n[0] + (sy - sh.P[1]) * sh.n[1] > 1e-6) return false;
  return true;
}
function clampF(s, g, f) {
  const inward = -s.sgn; let vx = f[0] - g[0], vy = f[1] - g[1];
  if (vx * inward < 0.01) vx = 0.01 * inward;
  const lim = Math.abs(vx) * Math.tan(TUNE.maxTilt * DEG);
  if (Math.abs(vy) > lim) vy = Math.sign(vy) * lim;
  const t = [g[0] + vx, g[1] + vy];
  if (okF(s, g, t)) return t;
  let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; okF(s, g, [g[0] + vx * m, g[1] + vy * m]) ? lo = m : hi = m; }
  return [g[0] + vx * lo, g[1] + vy * lo];
}
// 網目の頂点を巻いたあとの 3D 位置（シェーダと同じ式。自動チェック用）
function deform(sh, X) {
  const d = (X[0] - sh.P[0]) * sh.n[0] + (X[1] - sh.P[1]) * sh.n[1], pr = Math.PI * sh.r;
  if (d <= 0) return [X[0], X[1], 0];
  if (d < pr && sh.r > 1e-3) { const th = d / sh.r, k = sh.r * Math.sin(th) - d; return [X[0] + k * sh.n[0], X[1] + k * sh.n[1], sh.r * (1 - Math.cos(th))]; }
  const k = -(d - pr) - d; return [X[0] + k * sh.n[0], X[1] + k * sh.n[1], 2 * sh.r];
}
function solveD(L, r) { if (r < 1e-3) return L / 2; const pr = Math.PI * r; if (L >= pr) return (L + pr) / 2; let lo = 0, hi = pr; for (let i = 0; i < 32; i++) { const m = (lo + hi) / 2; (m - r * Math.sin(m / r) < L) ? lo = m : hi = m; } return (lo + hi) / 2; }
// g = つかんだ点（紙の端、指の高さ）、f = 指。返す：筒の始まり P、向き n（指→つかんだ点）、半径 r、lift（0〜1）
function shape(s, g, f) {
  const vx = g[0] - f[0], vy = g[1] - f[1], L = hyp(vx, vy);
  if (L < 0.25) return null;
  const n = [vx / L, vy / L];
  const land = 2 * s.spine - s.edge; // 着地点の x
  const toLand = Math.max(0, (f[0] - land) * s.sgn);
  let r = Math.min(TUNE.r0 + TUNE.rk * L, TUNE.rMax) * Math.min(1, toLand / TUNE.flatten);
  // 背の上端・下端が筒の中に入らないよう、入るときは半径を小さくする（背の近くでは紙がきつく巻く）
  const crosses = (rr) => { const D = solveD(L, rr), P = [g[0] - n[0] * D, g[1] - n[1] * D]; return [G.py0, G.py1].some((sy) => (s.spine - P[0]) * n[0] + (sy - P[1]) * n[1] > 0); };
  let rLimited = false;
  if (r > 0 && crosses(r)) { rLimited = true; let lo = 0, hi = r; for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; crosses(m) ? hi = m : lo = m; } r = lo; }
  const D = solveD(L, r);
  const P = [g[0] - n[0] * D, g[1] - n[1] * D];
  const lift = Math.min(1, L / (s.x1 - s.x0));
  return { P, n, r, L, lift, D, rLimited };
}

// ---- curl-webgl-r3.js ----
// WebGL 案：見開き全体を1枚の canvas に描く。紙は細かい網目を頂点シェーダで筒に巻き、明暗と影はフラグメントで計算する。
// 隠しつまみ（設計が決める値。初期値は design/21 §6.7〜6.9）
const K = {
  show: 0.16,        // 裏の透かし（表の内容を左右反転して混ぜる割合）
  backLine: 0.75,    // 裏の罫線の濃さ（表の罫線に対する割合。§6.9 で少し薄く）
  nextOnBack: 0,     // 裏には次の日を混ぜない（14:14 決定）。着地専用の紙だけ別途描く
  debug: 0,          // 1＝面の色分け（撮影の自動チェック用）
  hiF: 0.38, hiFdeg: 24, hiFw: 11,   // 巻きの表の光る筋
  ampR0: 8, ampR1: 28, // 半径 8pt 以下で巻きの明暗 0、28pt 以上で 100%（間はなめらかに）
  dkFm: 0.0045,      // 暗い筋の 43° での傾き（1° あたり）。両側の曲線をこの傾きでつなぐ
  hiMinW: 3,         // 光の筋の画面上の最小の幅（pt）。巻きが細いときも線にしない
  hiDark: 0.25,      // ダークで光の筋を何倍にするか（design/21 §6.11-7、0.25倍で確定）
  hiMask: 1,         // 光を紙色にだけ足す（1）。0 にすると前の作り（文字にも白が混ざり、背の近くで白く飛ぶ）
  dkF0: 0.06, dkF1: 0.36, dkFa: 43, dkFb: 89, // 巻きの表の暗い筋（43°〜89° で 6%→36%、傾きを連続に）
  dkB: 0.30, hiB: 0.45, hiBdeg: 160, hiBw: 6, // 巻きの裏：てっぺん側 30% 暗さ、160° に白 45%
  flatB: 0.0, flatBw: 60,            // 平らな裏の暗さ（§6.10 で 0。境目の縦線をなくす）
  shOp0: 0.42, shOpK: 0.22, shBl0: 7, shBlK: 34, shOff0: 3, shOffK: 10, // 落ちる影
  rootA0: 0.12, rootAK: 0.0, rootIn: 10, rootOut0: 9, rootOutK: 1,     // 根元（§6.10：表は 10pt で 0→12%、巻きはじめ 12%→0 を 9＋1×lift pt で。§6.10 の 4＋6×lift だと始めの 4pt で 12% 戻り、CS-16 の段になる。第3報）
  groove: 0.0,       // 溝の上で紙を暗くする量（§6.4 は 4%。縦の帯に見えるので既定は 0、つまみで戻せる）
  persp: 0,          // 遠近（0 で無し。付けると浮いた紙がページの外へはみ出すので既定は無し）
  grid: 2,           // 網目の細かさ（pt）
  darkShadow: 0.5,   // ダークモードの影の強さ（25 §2 は影なし。めくりだけ残すかは設計判断）
};
const VS = `attribute vec2 aX;uniform vec2 uP,uN,uView,uC;uniform float uR,uPersp;
varying vec2 vX,vQ;varying float vD;
void main(){float d=dot(aX-uP,uN);vec2 q=aX;float z=0.;float pr=3.14159265*uR;
 if(d>0.){if(d<pr&&uR>0.001){float th=d/uR;q=aX+(uR*sin(th)-d)*uN;z=uR*(1.-cos(th));}else{q=aX+(-(d-pr)-d)*uN;z=2.*uR+0.6;}}
 vX=aX;vD=d;vQ=q;vec2 s=uPersp>0.?uC+(q-uC)*(uPersp/(uPersp-z)):q;
 gl_Position=vec4(s.x/uView.x*2.-1.,1.-s.y/uView.y*2.,-(z+(d>0.?0.3:0.))/400.,1.);}`;
const COMMON = `precision highp float;
uniform vec2 uP,uN;uniform float uR,uLift,uDark;uniform vec4 uRect;
uniform float kShOp0,kShOpK,kShBl0,kShBlK,kShOff0,kShOffK,kSgn,kShadowMul;
float sdRect(vec2 X,vec4 r){vec2 c=(r.xy+r.zw)*.5,h=(r.zw-r.xy)*.5;vec2 q=abs(X-c)-h;return length(max(q,0.))+min(max(q.x,q.y),0.);}
float soft(vec2 X,float b){return 1.-smoothstep(-b,b,sdRect(X,uRect));}
// 持ち上がった紙（巻き＋平らな裏）を真上から見たときの、ぼかした覆い具合
float cover(vec2 Q,float b){float dq=dot(Q-uP,uN);float pr=3.14159265*uR;float c=0.;
 if(uR>0.001){float a=asin(clamp(dq/uR,0.,1.));float d1=uR*a,d2=pr-uR*a;
  float e=smoothstep(uR+b,uR-b,dq)*smoothstep(-b,b,dq);
  float h1=clamp((1.-cos(a))*1.2,0.,1.);
  c=max(c,e*max(soft(Q+(d1-dq)*uN,b)*h1,soft(Q+(d2-dq)*uN,b)));}
 float d3=pr-dq;c=max(c,smoothstep(b,-b,dq)*soft(Q+(d3-dq)*uN,b));return c;}
float dropShadow(vec2 Q){float L=uLift;float bl=kShBl0+kShBlK*L,op=kShOp0-kShOpK*L,o=kShOff0+kShOffK*L;
 vec2 off=vec2(0.3*o*kSgn,0.6*o);return op*cover(Q-off,bl)*kShadowMul;}`;
const FS_BASE = COMMON + `uniform sampler2D tLo,tLn,tRo,tRn;uniform vec4 rL,rR;uniform vec3 bg,groove;uniform float uStripX,uStripMix,uLnew,uRnew,uPaperA;varying vec2 vX;
void main(){vec2 Q=vX;vec3 c=bg;
 if(Q.x>=rL.x&&Q.x<=rL.z&&Q.y>=rL.y&&Q.y<=rL.w){vec2 uv=(Q-rL.xy)/(rL.zw-rL.xy);vec3 o=texture2D(tLo,uv).rgb,n=texture2D(tLn,uv).rgb;c=mix(o,n,Q.x<uStripX?uStripMix:uLnew);}
 else if(Q.x>=rR.x&&Q.x<=rR.z&&Q.y>=rR.y&&Q.y<=rR.w){vec2 uv=(Q-rR.xy)/(rR.zw-rR.xy);c=mix(texture2D(tRo,uv).rgb,texture2D(tRn,uv).rgb,uRnew);}
